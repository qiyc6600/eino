<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Eino Demo</title>
    <link rel="icon" href="data:,">
    <!-- The build that served this page. The server substitutes it, so a running
         tab can tell when the files it is executing are no longer the ones being
         served — see checkForNewBuild in app.js. -->
    <meta name="app-version" content="{{ASSET_VERSION}}">
    <link rel="stylesheet" href="/assets/styles.css?v={{ASSET_VERSION}}">
</head>
<body>
    <!-- Shown when the server has been upgraded while this tab stayed open. The
         page is running JS the server has replaced, so a bug fixed there can look
         unfixed here until someone reloads by hand. -->
    <div id="buildNotice" class="build-notice">
        <span>服务端已更新，当前页面仍在运行旧版本</span>
        <button onclick="location.reload()">刷新</button>
    </div>
    <!-- Login Page -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <h1>🤖 Agent Eino Demo</h1>
            <p class="subtitle">基于 Eino 的通用 Agent 框架演示</p>
            <div class="login-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password">
                </div>
                <!-- Shown when a request came back 401: the session is gone, so the
                     page returns here instead of reporting the failure in the chat. -->
                <div id="loginNotice" class="login-notice"></div>
                <button onclick="doLogin()" class="btn btn-primary">登录</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="page">
        <div class="app-layout">
            <!-- Left Sidebar -->
            <div class="sidebar">
                <div class="sidebar-section">
                    <!-- The logout control sits in the identity card rather than as a
                         full-width button below it: it acts on the signed-in account,
                         so it belongs with the account, and a session that ends
                         rarely does not need the most prominent control on the page. -->
                    <div class="user-card">
                        <div id="currentUser" class="user-card-info"></div>
                        <button onclick="doLogout()" class="btn-logout" title="退出登录">退出</button>
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3>会话</h3>
                    <div id="threadList" class="thread-list"></div>
                    <button onclick="newThread()" class="btn btn-sm btn-full">新建会话</button>
                </div>
                <div class="sidebar-section">
                    <details class="model-details">
                        <summary>🤖 AI 模型</summary>
                        <div id="modelSelector" class="model-selector"></div>
                    </details>
                </div>
            </div>

            <!-- Main Chat Area -->
            <div class="chat-area">
                <div class="chat-header">
                    <h2>💬 智能助手</h2>
                    <div class="demo-dropdown">
                        <button onclick="toggleDemoMenu(event)" class="btn btn-sm btn-demo">🎬 演示 ▾</button>
                        <div id="demoMenu" class="demo-menu" style="display:none;">
                            <button onclick="runDemoFromMenu('visitor_deny')">🚫 Visitor 越权</button>
                            <button onclick="runDemoFromMenu('admin_approve')">✅ Admin 审批</button>
                            <button onclick="runDemoFromMenu('diff_tools')">🔀 工具路由</button>
                            <button onclick="runDemoFromMenu('long_chat')">✂️ 长对话裁剪</button>
                            <button onclick="runDemoFromMenu('memory')">🧠 记忆管理</button>
                        </div>
                    </div>
                </div>
                <div id="chatMessages" class="chat-messages"></div>
                <div id="tokenBar" class="token-bar">
                    <div class="token-bar-track">
                        <div id="tokenBarFill" class="token-bar-fill" style="width:0%"></div>
                        <div id="tokenBarThreshold" class="token-bar-threshold" style="left:80%"></div>
                    </div>
                    <div class="token-bar-label">
                        <span id="tokenBarText">上下文: 0 / 8000 tokens</span>
                        <!-- Administrators can move the two knobs behind the threshold;
                             the label above is the derived number they add up to. -->
                        <button id="contextSettingsToggle" class="token-bar-settings"
                                onclick="toggleContextSettings()" style="display:none"
                                title="调整上下文窗口与压缩阈值">⚙</button>
                    </div>
                    <div id="contextSettings" class="context-settings" style="display:none">
                        <label>上下文窗口 <input type="number" id="ctxMaxTokens" min="256" step="256"></label>
                        <label>压缩触发比例 <input type="number" id="ctxRatio" min="0.05" max="1" step="0.05"></label>
                        <label>摘要目标 tokens <input type="number" id="ctxTarget" min="1" step="50"></label>
                        <div id="ctxDerived" class="context-derived"></div>
                        <div class="context-settings-actions">
                            <span class="context-hint">重启后恢复配置文件的值</span>
                            <button class="btn btn-sm btn-primary" onclick="saveContextSettings()">应用</button>
                        </div>
                    </div>
                </div>
                <div id="streamProgress" class="stream-progress" style="display:none;"></div>
                <div class="chat-input">
                    <label class="confirm-toggle" title="开启后，Agent 生成执行计划会先暂停，等待人工审批后才执行工具">
                        <input type="checkbox" id="confirmBeforeExecute">
                        <span>⚠️ 执行前确认</span>
                    </label>
                    <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button id="stopBtn" onclick="stopStreaming()" class="btn btn-danger" style="display:none;">停止</button>
                    <button id="sendBtn" onclick="sendMessage()" class="btn btn-primary">发送</button>
                </div>
            </div>

            <!-- Right Sidebar -->
            <div class="right-sidebar">
                <div class="panel-tabs">
                    <button id="tab-approvals" class="panel-tab active" onclick="switchPanelTab('approvals')">📋 审批<span id="approvalBadge" class="tab-badge" style="display:none;">0</span></button>
                    <button id="tab-memory" class="panel-tab" onclick="switchPanelTab('memory')">🧠 记忆</button>
                    <button id="tab-documents" class="panel-tab" onclick="switchPanelTab('documents')">📄 文档</button>
                    <button id="tab-tools" class="panel-tab" onclick="switchPanelTab('tools')">🔧 工具</button>
                    <button id="tab-events" class="panel-tab" onclick="switchPanelTab('events')">📝 事件</button>
                </div>
                <div id="panel-approvals" class="tab-panel active">
                    <div id="approvalList" class="approval-list"></div>
                </div>
                <div id="panel-memory" class="tab-panel">
                    <div id="memoryList" class="memory-list"></div>
                    <div class="memory-actions">
                        <label class="confirm-toggle" title="开启后不再从对话中提取记忆，也不再把已有记忆注入提示词；已有条目保留，随时可以恢复">
                            <input type="checkbox" id="memoryDisabled" onchange="toggleMemorySetting(this.checked)">
                            <span>🙈 禁止记忆</span>
                        </label>
                        <button onclick="refreshMemory()" class="btn btn-sm">刷新</button>
                        <button onclick="consolidateMemory()" class="btn btn-sm" title="归档低价值记忆，LLM 整合用户画像并沉淀新事实">🧹 整合记忆</button>
                    </div>
                </div>
                <div id="panel-tools" class="tab-panel">
                    <div id="toolList" class="tool-list"></div>
                </div>
                <div id="panel-documents" class="tab-panel">
                    <div class="doc-form">
                        <input type="text" id="docName" placeholder="文档名称">
                        <textarea id="docContent" placeholder="粘贴文档内容，或选择 .txt / .md 文件"></textarea>
                        <div class="doc-form-actions">
                            <label class="btn btn-sm doc-file-label" title="选择 .txt 或 .md 文件（在浏览器内读为文本后提交）">
                                📎 选择文件
                                <input type="file" id="docFile" accept=".txt,.md,text/plain,text/markdown" onchange="loadDocumentFile(this)">
                            </label>
                            <button onclick="uploadDocument()" class="btn btn-sm btn-primary">上传</button>
                        </div>
                    </div>
                    <div id="documentList" class="document-list"></div>
                    <div class="doc-hint" id="docHint"></div>
                </div>
                <div id="panel-events" class="tab-panel">
                    <div id="eventList" class="event-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/app.js?v={{ASSET_VERSION}}"></script>

    <!-- API Key Modal -->
    <div id="apiKeyModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3 id="apiKeyModalTitle">🔑 输入 API Key</h3>
            <p id="apiKeyModalDesc">该模型需要 API Key 才能使用。</p>
            <div class="form-group">
                <input type="password" id="apiKeyInput" placeholder="输入 API Key...">
            </div>
            <div class="modal-actions">
                <button onclick="cancelApiKey()" class="btn btn-sm">取消</button>
                <button onclick="confirmApiKey()" class="btn btn-sm btn-primary">确认</button>
            </div>
        </div>
    </div>
</body>
</html>
