<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Eino Demo</title>
    <link rel="stylesheet" href="/assets/styles.css?v=7">
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <h1>🤖 Agent Eino Demo</h1>
            <p class="subtitle">基于 Eino 的通用 Agent 框架演示</p>
            <div class="login-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="admin 或 visitor" value="admin">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="密码" value="admin123">
                </div>
                <button onclick="doLogin()" class="btn btn-primary">登录</button>
                <div class="quick-login">
                    <span>快速登录：</span>
                    <button onclick="quickLogin('admin','admin123')" class="btn btn-sm">Admin</button>
                    <button onclick="quickLogin('visitor','visitor123')" class="btn btn-sm">Visitor</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="page">
        <div class="app-layout">
            <!-- Left Sidebar -->
            <div class="sidebar">
                <div class="sidebar-section">
                    <h3>当前用户</h3>
                    <div id="currentUser" class="user-card"></div>
                </div>
                <div class="sidebar-section">
                    <h3>角色与权限</h3>
                    <div id="roleInfo" class="role-info"></div>
                </div>
                <div class="sidebar-section">
                    <h3>会话</h3>
                    <div id="threadList" class="thread-list"></div>
                    <button onclick="newThread()" class="btn btn-sm btn-full">新建会话</button>
                </div>
                <div class="sidebar-section">
                    <h3>🤖 AI 模型</h3>
                    <div id="modelSelector" class="model-selector"></div>
                </div>
                <div class="sidebar-section">
                    <button onclick="doLogout()" class="btn btn-danger btn-full">退出登录</button>
                </div>
            </div>

            <!-- Main Chat Area -->
            <div class="chat-area">
                <div class="chat-header">
                    <h2>💬 智能助手</h2>
                    <div class="demo-buttons">
                        <span class="demo-label">演示脚本：</span>
                        <button onclick="runDemo('visitor_deny')" class="btn btn-sm btn-demo">Visitor越权</button>
                        <button onclick="runDemo('admin_approve')" class="btn btn-sm btn-demo">Admin审批</button>
                        <button onclick="runDemo('diff_tools')" class="btn btn-sm btn-demo">不同工具路径</button>
                        <button onclick="runDemo('long_chat')" class="btn btn-sm btn-demo">长对话裁剪</button>
                        <button onclick="runDemo('memory')" class="btn btn-sm btn-demo">记忆管理</button>
                    </div>
                </div>
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()" class="btn btn-primary">发送</button>
                </div>
            </div>

            <!-- Right Sidebar -->
            <div class="right-sidebar">
                <div class="sidebar-section">
                    <h3>📋 审批中心</h3>
                    <div id="approvalList" class="approval-list"></div>
                    <button onclick="refreshApprovals()" class="btn btn-sm btn-full">刷新</button>
                </div>
                <div class="sidebar-section">
                    <h3>🔧 可用工具</h3>
                    <div id="toolList" class="tool-list"></div>
                </div>
                <div class="sidebar-section">
                    <h3>📝 运行事件</h3>
                    <div id="eventList" class="event-list"></div>
                </div>
                <div class="sidebar-section">
                    <h3>🧠 用户记忆</h3>
                    <div id="memoryList" class="memory-list"></div>
                    <button onclick="refreshMemory()" class="btn btn-sm btn-full">刷新</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/app.js?v=7"></script>

    <!-- API Key Modal -->
    <div id="apiKeyModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3 id="apiKeyModalTitle">🔑 输入 API Key</h3>
            <p id="apiKeyModalDesc">该模型需要 API Key 才能使用。</p>
            <div class="form-group">
                <input type="password" id="apiKeyInput" placeholder="输入 API Key...">
            </div>
            <div class="modal-actions">
                <button onclick="cancelApiKey()" class="btn btn-sm">取消</button>
                <button onclick="confirmApiKey()" class="btn btn-sm btn-primary">确认</button>
            </div>
        </div>
    </div>
</body>
</html>
